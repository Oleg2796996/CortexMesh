# Alembic configuration for CortexMesh.
# Reads DSN from the same env var the app uses (CORTEXMESH_DATABASE_URL /
# CORTEXMESH_DB_DSN — psycopg-style URL is fine).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# File-template for new revisions (down_revision placeholder; auto-managed).
file_template = %%(rev)s_%%(slug)s

# Migrations transactional by default (Postgres DDL is transactional anyway).
transactional_migrations = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
