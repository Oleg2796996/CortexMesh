version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentmesh-db
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: meshpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh -d agentmesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: agentmesh-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mesh:meshpassword@db:5432/agentmesh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
