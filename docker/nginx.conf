# CortexMesh production nginx (TLS termination).
# Mounted at /etc/nginx/conf.d/cortexmesh.conf in the cortexmesh-nginx
# container. Terminates TLS, forwards to api:8000, adds security headers.

# Plain HTTP → redirect to HTTPS.
server {
    listen      80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     /etc/ssl/cortexmesh/cert.pem;
    ssl_certificate_key /etc/ssl/cortexmesh/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers (defence-in-depth on top of what FastAPI sends).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header X-Frame-Options           "DENY"                               always;
    add_header Referrer-Policy           "no-referrer"                         always;
    add_header Content-Security-Policy   "default-src 'none'"                 always;

    client_max_body_size 1m;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_buffering off;

    access_log /var/log/nginx/cortexmesh.access.log;
    error_log  /var/log/nginx/cortexmesh.error.log warn;

    location / {
        proxy_pass http://api:8000;
    }
}